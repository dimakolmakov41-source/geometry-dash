
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09091c">
    <title>Neon Dash</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">

        <!-- Игровое поле -->
        <canvas id="gameCanvas"></canvas>

        <!-- Верхняя панель -->
        <header class="top-bar">
            <div class="logo">
                NEON<span>DASH</span>
            </div>

            <div class="stats">
                <div class="stat">
                    <small>ПРОГРЕСС</small>
                    <span id="progress">0%</span>
                </div>

                <div class="stat">
                    <small>РЕКОРД</small>
                    <span id="best">0%</span>
                </div>
            </div>

            <button id="pauseButton" aria-label="Пауза">
                Ⅱ
            </button>
        </header>

        <!-- Главное меню -->
        <div id="menu" class="screen">
            <div class="menu-box">

                <div class="cube-icon">◆</div>

                <p class="subtitle">ГОТОВ К ИСПЫТАНИЮ?</p>

                <h1>
                    NEON <span>DASH</span>
                </h1>

                <p class="description">
                    Прыгай через шипы и доберись до финиша!
                </p>

                <button id="startButton" class="main-button">
                    ИГРАТЬ ▶
                </button>

                <p class="controls">
                    КАСАНИЕ ЭКРАНА / ПРОБЕЛ — ПРЫЖОК
                </p>

            </div>
        </div>

        <!-- Меню паузы -->
        <div id="pauseMenu" class="screen hidden">
            <div class="menu-box">

                <h2>ПАУЗА</h2>

                <button id="resumeButton" class="main-button">
                    ПРОДОЛЖИТЬ ▶
                </button>

                <button id="restartButton" class="secondary-button">
                    НАЧАТЬ ЗАНОВО ↻
                </button>

            </div>
        </div>

        <!-- Экран проигрыша -->
        <div id="gameOverMenu" class="screen hidden">
            <div class="menu-box">

                <h2>ПОПРОБУЙ ЕЩЁ!</h2>

                <p class="description">
                    Шипы не пройдут сами по себе!
                </p>

                <button id="retryButton" class="main-button">
                    ЕЩЁ РАЗ ↻
                </button>

            </div>
        </div>

        <!-- Экран победы -->
        <div id="winMenu" class="screen hidden">
            <div class="menu-box">

                <h2>ТЫ ПОБЕДИЛ!</h2>

                <p class="description">
                    Отлично! Уровень пройден на 100%.
                </p>

                <button id="nextButton" class="main-button">
                    ИГРАТЬ СНОВА ▶
                </button>

            </div>
        </div>

        <!-- Нижняя панель -->
        <footer class="bottom-bar">

            <div class="level-name">
                УРОВЕНЬ <span>01</span>
            </div>

            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <div class="level-status">
                NEON WORLD
            </div>

        </footer>

    </div>

    <!-- Игровая логика -->
    <script src="js.script"></script>

</body>
</html>
